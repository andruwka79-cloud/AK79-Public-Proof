name: public-proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run public ambiguity tests
        run: python -m unittest discover -s tests -v
      - name: Verify release manifest, checksums and markers
        run: python release/verify_release.py
      - name: Verify JSON parses
        run: |
          python -m json.tool benchmark/visible_vectors.json > /dev/null
          python -m json.tool results/public_results_v1.json > /dev/null
